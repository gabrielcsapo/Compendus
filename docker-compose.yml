services:
  compendus:
    build:
      context: .
      args:
        GPU_BACKEND: ${GPU_BACKEND:-cpu}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_OPTIONS=--max-old-space-size=3072
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
    deploy:
      resources:
        limits:
          # Covers Node (3 GB heap) + the in-process GLiNER/embedding ONNX models
          # + headroom for PDF/image spikes.
          memory: 8G
        reservations:
          memory: 2G
    restart: unless-stopped
    # ---------- GPU access ----------
    # NVIDIA: uncomment below (requires nvidia-container-toolkit on host)
    #   deploy.resources.reservations.devices:
    #     - driver: nvidia
    #       count: 1
    #       capabilities: [gpu]
    #
    # AMD ROCm: uncomment below (build with GPU_BACKEND=rocm)
    # devices:
    #   - /dev/kfd
    #   - /dev/dri
    # group_add:
    #   - video
    #   - render
