<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compendus</title>
    <meta name="description" content="Compendus — a self-hosted personal digital library manager" />
    <meta name="theme-color" content="#0e1512" />
    <link rel="icon" type="image/svg+xml" href="/compendus/favicon.svg" />
    <link rel="apple-touch-icon" href="/compendus/apple-touch-icon.png" />
    <script>
      (function () {
        var theme = localStorage.getItem("theme");
        if (
          theme === "dark" ||
          (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
